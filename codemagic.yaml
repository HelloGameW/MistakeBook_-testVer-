workflows:
  mistakebook-ios-device:
    name: MistakeBook iPhone Unsigned Build

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Show Xcode version
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build/logs"
          xcodebuild -version | tee "$CM_BUILD_DIR/build/logs/xcode-version.log"

      - name: Show project schemes
        script: |
          set -euo pipefail
          xcodebuild \
            -project "$CM_BUILD_DIR/MistakeBook.xcodeproj" \
            -list

      - name: Resolve Swift packages
        script: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project "$CM_BUILD_DIR/MistakeBook.xcodeproj"

      - name: Build MistakeBook for iPhone
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$CM_BUILD_DIR/MistakeBook.xcodeproj" \
            -scheme "MistakeBook" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/build/device" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$CM_BUILD_DIR/build/logs/iphone-build.log"

      - name: Run regression tests on iPhone simulator
        script: |
          bash "$CM_BUILD_DIR/Scripts/ci-test.sh"

      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/device/Build/Products/Debug-iphoneos/MistakeBook.app"
          test -d "$APP_PATH"
          PACKAGE_DIR=$(mktemp -d "$CM_BUILD_DIR/build/ipa.XXXXXX")
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/MistakeBook.app"
          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry MistakeBook-unsigned.ipa Payload
          mv MistakeBook-unsigned.ipa "$CM_BUILD_DIR/MistakeBook-unsigned.ipa"
          ls -lh "$CM_BUILD_DIR/MistakeBook-unsigned.ipa"

    artifacts:
      - $CM_BUILD_DIR/MistakeBook-unsigned.ipa
      - $CM_BUILD_DIR/build/device/Build/Products/Debug-iphoneos/*.app
      - $CM_BUILD_DIR/build/device/Build/Products/Debug-iphoneos/*.dSYM
      - $CM_BUILD_DIR/build/logs/*.log
      - $CM_BUILD_DIR/build/*.xcresult
